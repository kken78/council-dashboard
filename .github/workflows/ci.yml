name: ci
# PR のたびにデータ検査とビルドを行う（公開はしない。公開は main への push で build.yml が行う）。
# あわせて、hino-portal の shared/ の文字の大きさの検査（静的検査と、幅 360px と 1024px での実寸）を走らせる。
on:
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: データ検査
        run: python scripts/validate.py
      - name: ビルド
        run: python build.py

      # 文字の大きさは hino-portal DESIGN.md 5.2（docs/DESIGN_REVIEW.md ADR-1）
      # このページは共通の部品（見出し・ナビ・フッター）を写していない（hino-portal DESIGN.md 8章）。
      # check.py が出す共通の部品の問題（<title> の形、portal-shared のブロックが無い）は除き、ほかの問題が1件でもあれば止める。
      - name: 文字の大きさ（hino-portal の shared/check.py --fonts）
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py --fonts docs/index.html > /tmp/check.txt || true
          cat /tmp/check.txt
          grep -q '^docs/index.html' /tmp/check.txt
          if grep '^  - ' /tmp/check.txt | grep -v -E '^  - (<title> の形が違う|portal-shared:(css|header|siblings|footer) のブロックが無い)'; then
            echo "文字の大きさの問題がある"; exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 実ブラウザでの文字の大きさと横のはみ出し（hino-portal の shared/check_mobile.mjs）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs node /tmp/hino-portal/shared/check_mobile.mjs docs/index.html
